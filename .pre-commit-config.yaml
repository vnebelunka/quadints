default_install_hook_types:
  - prepare-commit-msg

repos:
  - repo: local
    hooks:
      - id: koji-commit-msg
        name: koji conventional commit
        entry: bash -c 'exec < /dev/tty > /dev/tty 2>&1 && koji --hook || true'
        language: system
        stages:
          - prepare-commit-msg
        require_serial: true
        verbose: true
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        args: [--style=file]  # Раскомментируйте, если используете .clang-format

  - repo: local
    hooks:
      - id: cmake-build-test
        name: CMake Build & Test
        entry: bash -c 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON && cmake --build build --parallel && ctest --test-dir build --output-on-failure'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
